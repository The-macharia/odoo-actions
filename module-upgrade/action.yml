name: Upgrade Odoo modules
description: Update modules on the stack's database, in a throwaway container from the live image.
inputs:
  stack:
    description: Swarm stack name
    required: true
  db:
    description: Odoo database name
    required: true
  modules:
    description: Comma-separated modules or all to force `-u`; empty updates only modules whose code changed
runs:
  using: composite
  steps:
    - shell: bash
      env:
        STACK: ${{ inputs.stack }}
        DB: ${{ inputs.db }}
        MODULES: ${{ inputs.modules }}
      run: |
        set -euo pipefail
        run() { bash "$GITHUB_ACTION_PATH/../bin/odoo-run" "$STACK" "$@"; }

        # a deploy that changed the db service restarts postgres; converged is not yet accepting connections
        for _ in $(seq 60); do
            run pg_isready -h db -q && break
            sleep 2
        done

        if [ -z "$MODULES" ]; then
            run click-odoo-update -c /etc/odoo/odoo.conf -d "$DB"
        else
            run odoo -d "$DB" -u "$MODULES" --no-http --stop-after-init
        fi
