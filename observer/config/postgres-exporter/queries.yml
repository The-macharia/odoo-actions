# Odoo names its connections "<ODOO_PGAPPNAME prefix>-<pid>" (default "odoo-<pid>"); the pid
# is the one Odoo prints on every log line, so `opid` joins a connection to that worker's logs.
pg_holder:
  query: |
    SELECT coalesce(nullif(regexp_replace(application_name, '-\d+$', ''), ''), 'unnamed') AS holder,
           coalesce(substring(application_name FROM '-(\d+)$'), '') AS opid,
           coalesce(state, 'unknown') AS state,
           coalesce(datname, '') AS datname,
           coalesce(usename, '') AS usename,
           coalesce(host(client_addr), 'local') AS client,
           count(*) AS connections,
           coalesce(max(extract(epoch FROM now() - xact_start)), 0) AS max_xact_seconds
    FROM pg_stat_activity
    WHERE backend_type = 'client backend'
    GROUP BY 1, 2, 3, 4, 5, 6
  metrics:
    - holder: {usage: LABEL, description: application_name without the trailing pid}
    - opid: {usage: LABEL, description: Odoo worker pid from application_name}
    - state: {usage: LABEL, description: Backend state}
    - datname: {usage: LABEL, description: Database}
    - usename: {usage: LABEL, description: Role}
    - client: {usage: LABEL, description: Client address}
    - connections: {usage: GAUGE, description: Open connections}
    - max_xact_seconds: {usage: GAUGE, description: Age of the oldest open transaction}

pg_blocked:
  query: |
    SELECT count(*) AS sessions,
           coalesce(max(extract(epoch FROM now() - query_start)), 0) AS max_wait_seconds
    FROM pg_stat_activity
    WHERE cardinality(pg_blocking_pids(pid)) > 0
  metrics:
    - sessions: {usage: GAUGE, description: Sessions waiting on another session's lock}
    - max_wait_seconds: {usage: GAUGE, description: Longest such wait}

pg_wraparound:
  query: SELECT datname, age(datfrozenxid) AS xid_age FROM pg_database WHERE datallowconn
  metrics:
    - datname: {usage: LABEL, description: Database}
    - xid_age: {usage: GAUGE, description: Transactions since the oldest unfrozen xid}

# Sizes are pg_class page estimates (current as of the last vacuum/analyze): pg_total_relation_size()
# waits on each table's lock, so one ALTER TABLE during a module upgrade stalled the whole scrape.
pg_table:
  query: |
    SELECT s.relname,
           (c.relpages + coalesce(t.relpages, 0) + coalesce(i.pages, 0))::bigint
               * current_setting('block_size')::int AS total_bytes,
           coalesce(i.pages, 0)::bigint * current_setting('block_size')::int AS index_bytes,
           s.n_live_tup,
           s.n_dead_tup
    FROM pg_stat_user_tables s
    JOIN pg_class c ON c.oid = s.relid
    LEFT JOIN pg_class t ON t.oid = c.reltoastrelid
    LEFT JOIN (SELECT x.indrelid, sum(ic.relpages) AS pages
               FROM pg_index x JOIN pg_class ic ON ic.oid = x.indexrelid
               GROUP BY x.indrelid) i ON i.indrelid = s.relid
    ORDER BY 2 DESC
    LIMIT 30
  metrics:
    - relname: {usage: LABEL, description: Table}
    - total_bytes: {usage: GAUGE, description: Size including indexes and TOAST}
    - index_bytes: {usage: GAUGE, description: Index size}
    - n_live_tup: {usage: GAUGE, description: Estimated live rows}
    - n_dead_tup: {usage: GAUGE, description: Estimated dead rows}
