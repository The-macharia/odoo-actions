groups:
  - name: observer-logs
    rules:
      - alert: OdooErrorSpike
        expr: |
          sum by (client, service) (count_over_time({service=~".+_(odoo|website|odoo15)", level=~"ERROR|CRITICAL"}[5m])) > 20
        labels: {severity: warning}
        annotations:
          summary: '{{ $value }} Odoo errors in 5 minutes on {{ $labels.service }}'
          description: The errors-by-module panel shows where they come from.
          dashboard: __URL__/d/odoo
      - alert: OdooWorkerKilled
        expr: |
          sum by (client, service) (count_over_time({service=~".+_(odoo|website|odoo15)"} |~ `timeout after \d+s|CPU time limit` [10m])) > 0
        labels: {severity: warning}
        annotations:
          summary: Odoo killed a worker for exceeding its time limit on {{ $labels.service }}
          description: A killed worker's Postgres sessions can outlive it; check connections.
          dashboard: __URL__/d/odoo
      - alert: OdooPoolFull
        expr: |
          sum by (client, service) (count_over_time({service=~".+_(odoo|website|odoo15)"} |= `The Connection Pool Is Full` [5m])) > 0
        labels: {severity: critical}
        annotations:
          summary: An Odoo process hit db_maxconn on {{ $labels.service }}
          description: One process used all its pooled connections; the pid is on the log line.
          dashboard: __URL__/d/pg-connections
      - alert: PostgresTooManyClients
        expr: |
          sum by (client) (count_over_time({service=~".+_(odoo|website|odoo15|db)"} |~ `too many clients|remaining connection slots are reserved` [5m])) > 0
        labels: {severity: critical}
        annotations:
          summary: Postgres is refusing connections
          description: The connection holders and session recorder show who held them at the time.
          dashboard: __URL__/d/pg-connections
      - alert: PostgresErrorSpike
        expr: |
          sum by (client) (count_over_time({service=~".+_db", level=~"ERROR|FATAL|PANIC"}[5m])) > 10
        labels: {severity: warning}
        annotations:
          summary: '{{ $value }} Postgres errors in 5 minutes'
          description: Each log line carries app=, the Odoo process that caused it.
          dashboard: __URL__/d/pg-locks
