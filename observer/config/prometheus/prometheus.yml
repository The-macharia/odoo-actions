global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    client: __CLIENT__

rule_files:
  - /etc/prometheus/rules/*.yml

# hub only: fleet federation and outside probes
scrape_config_files:
  - /etc/prometheus/scrape/*.yml

alerting:
  alertmanagers:
    - scheme: __AM_SCHEME__
      path_prefix: /alertmanager
      basic_auth:
        username: fleet
        password_file: /etc/observer/fleet_password
      static_configs:
        - targets: ['__AM_HOST__']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # global services: one A record per task
  - job_name: node
    dns_sd_configs:
      - names: ['tasks.observer_node-exporter']
        type: A
        port: 9100

  - job_name: cadvisor
    dns_sd_configs:
      - names: ['tasks.observer_cadvisor']
        type: A
        port: 8080

  - job_name: alloy
    dns_sd_configs:
      - names: ['tasks.observer_alloy']
        type: A
        port: 12345

  - job_name: loki
    static_configs:
      - targets: ['loki:3100']

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: odoo
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://__STACK___odoo:8069/web/health']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
