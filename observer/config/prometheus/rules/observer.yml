groups:
  # The hub federates observer:* to draw the fleet page.
  - name: observer-summary
    rules:
      - record: observer:pg_connections_usable
        expr: >-
          max(pg_settings_max_connections)
          - max(pg_settings_superuser_reserved_connections)
          - max(pg_settings_reserved_connections)
      - record: observer:pg_connections:ratio
        expr: sum(pg_holder_connections{usename!="observer"}) / observer:pg_connections_usable
      - record: observer:cpu:ratio
        expr: 1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))
      - record: observer:memory:ratio
        expr: 1 - sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes)
      - record: observer:disk:ratio
        expr: >-
          max(1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|nsfs|fuse.*"}
                / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|nsfs|fuse.*"})
      - record: observer:odoo:up
        expr: min(probe_success{job="odoo"})

  - name: observer-host
    rules:
      - alert: HostCpuHigh
        expr: observer:cpu:ratio > 0.85
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: CPU at {{ $value | humanizePercentage }}
          description: Check CPU per service; long Odoo requests and crons are the usual cause.
          dashboard: __URL__/d/server
      - alert: HostMemoryLow
        expr: observer:memory:ratio > 0.9
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: Memory {{ $value | humanizePercentage }} used
          description: Check memory per service and Odoo worker recycling (limit_memory_soft).
          dashboard: __URL__/d/server
      - alert: HostOomKill
        expr: increase(node_vmstat_oom_kill[5m]) > 0
        labels: {severity: critical}
        annotations:
          summary: The kernel killed a process for lack of memory
          description: Look for the service that restarted at the same time.
          dashboard: __URL__/d/server
      - alert: HostDiskUsageHigh
        expr: observer:disk:ratio > 0.85
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: Disk {{ $value | humanizePercentage }} full
          description: Usual suspects are backups, docker images and the filestore.
          dashboard: __URL__/d/server
      - alert: HostDiskFillingUp
        expr: >-
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|nsfs|fuse.*"}[6h], 86400) < 0
        for: 30m
        labels: {severity: critical}
        annotations:
          summary: '{{ $labels.mountpoint }} will be full within 24h at the current rate'
          description: Free space now or the database stops accepting writes.
          dashboard: __URL__/d/server
      # each restart is a new container, so >3 containers of one service in 15 min is a loop
      - alert: ServiceRestarting
        expr: >-
          count by (service) (label_replace(
            max_over_time(container_start_time_seconds{container_label_com_docker_swarm_service_name!=""}[15m]),
            "service", "$1", "container_label_com_docker_swarm_service_name", "(.+)")) > 3
        labels: {severity: critical}
        annotations:
          summary: '{{ $labels.service }} restarted {{ $value }} times in 15 minutes'
          description: Read the service's last log lines before it was replaced.
          dashboard: __URL__/d/server

  - name: observer-odoo
    rules:
      - alert: OdooDown
        expr: probe_success{job="odoo"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: Odoo health check failing
          description: Check Postgres connections first, then the Odoo log.
          dashboard: __URL__/d/pg-connections
      - alert: OdooSlow
        expr: probe_duration_seconds{job="odoo"} > 5
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Odoo health check takes {{ $value | humanizeDuration }}
          description: All workers are probably busy; see slow requests and crons.
          dashboard: __URL__/d/odoo

  - name: observer-postgres
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: Postgres is not answering
          description: Check the db service log.
          dashboard: __URL__/d/pg-connections
      - alert: PostgresConnectionsHigh
        expr: observer:pg_connections:ratio > 0.8
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: '{{ $value | humanizePercentage }} of usable connections taken'
          description: The holders table shows which process and address hold them.
          dashboard: __URL__/d/pg-connections
      - alert: PostgresConnectionsHigh
        expr: observer:pg_connections:ratio > 0.9
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: '{{ $value | humanizePercentage }} of usable connections taken'
          description: New connections will be refused soon. The holders table shows who holds them.
          dashboard: __URL__/d/pg-connections
      - alert: PostgresIdleInTransaction
        expr: max by (holder, opid, datname) (pg_holder_max_xact_seconds{state=~"idle in transaction.*"}) > 300
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.holder }}-{{ $labels.opid }} has sat idle in a transaction for {{ $value | humanizeDuration }}'
          description: It holds its locks and its connection until it commits; look up that pid in the Odoo log.
          dashboard: __URL__/d/pg-connections
      - alert: PostgresLongTransaction
        expr: >-
          max by (holder, opid, datname) (pg_holder_max_xact_seconds{state="active", holder!~"pg_dump|observer-.*"}) > 900
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.holder }}-{{ $labels.opid }} has run one transaction for {{ $value | humanizeDuration }}'
          description: The live sessions table on /monitor shows the query.
          dashboard: __URL__/d/pg-live
      - alert: PostgresBlocked
        expr: pg_blocked_max_wait_seconds > 120
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: A session has waited {{ $value | humanizeDuration }} on a lock
          description: The blocking chain on /monitor names the blocker.
          dashboard: __URL__/d/pg-live
      - alert: PostgresDeadlock
        expr: sum by (datname) (increase(pg_stat_database_deadlocks[5m])) > 0
        labels: {severity: warning}
        annotations:
          summary: Deadlock in {{ $labels.datname }}
          description: The Postgres log has both statements and their pids.
          dashboard: __URL__/d/pg-locks
      - alert: PostgresWraparound
        expr: max(pg_wraparound_xid_age) > 1e9
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: Transaction id age {{ $value }}
          description: Autovacuum is not freezing; run VACUUM FREEZE before Postgres forces it.
          dashboard: __URL__/d/pg-performance

  - name: observer-platform
    rules:
      - alert: BackupTooOld
        expr: time() - max(odoo_backup_last_success_timestamp_seconds) > 26 * 3600
        labels: {severity: critical}
        annotations:
          summary: Last good backup is {{ $value | humanizeDuration }} old
          description: Check the Database Backup workflow runs.
          dashboard: __URL__/d/server
      - alert: BackupMissing
        expr: absent(odoo_backup_last_success_timestamp_seconds)
        for: 26h
        labels: {severity: critical}
        annotations:
          summary: No backup has been recorded on this server
          description: The backup action writes odoo_backup.prom into BACKUP_DIR on success.
          dashboard: __URL__/d/server
      - alert: MonitoringTargetDown
        expr: up{job!~"fleet.*"} == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.job }} is not reporting'
          description: Its panels and alerts are blind until it is back.
          dashboard: __URL__/d/server
