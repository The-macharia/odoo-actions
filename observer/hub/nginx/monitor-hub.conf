# Written by the observer action on the hub once the certificate exists.
server {
    listen 443 ssl;
    server_name __HUB__;

    ssl_certificate /etc/letsencrypt/live/__HUB__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__HUB__/privkey.pem;

    # every server's Prometheus and Loki post alerts here
    location ^~ /alertmanager/ {
        auth_basic observer;
        auth_basic_user_file /etc/nginx/conf.d/monitor/htpasswd;
        resolver 127.0.0.11 valid=30s;
        set $observer_alertmanager observer_alertmanager:9093;
        proxy_pass http://$observer_alertmanager;
        proxy_set_header Host $host;
    }

    location / {
        resolver 127.0.0.11 valid=30s;
        set $observer_grafana observer_grafana:3000;
        proxy_pass http://$observer_grafana;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }
}
