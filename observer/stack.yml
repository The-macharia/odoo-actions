# Swarm stack "observer". observer.sh copies this next to ./etc and ./secrets and exports every ${VAR}.
x-logging: &logging
  driver: json-file
  options: {max-size: 20m, max-file: '3'}

services:
  prometheus:
    image: prom/prometheus:v3.13.4
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=4GB
    volumes:
      - ./etc/prometheus:/etc/prometheus:ro
      - ./secrets/fleet_password:/etc/observer/fleet_password:ro
      - prometheus-data:/prometheus
    networks: [app]
    logging: *logging
    deploy:
      resources:
        limits: {cpus: '0.50', memory: 512M}
        reservations: {memory: 128M}

  loki:
    image: grafana/loki:3.7.8
    command: [-config.file=/etc/loki/loki.yml, -config.expand-env=true]
    environment:
      FLEET_PASSWORD: ${FLEET_PASSWORD}
    volumes:
      - ./etc/loki:/etc/loki:ro
      - loki-data:/loki
    networks: [app]
    logging: *logging
    deploy:
      resources:
        limits: {cpus: '0.50', memory: 512M}
        reservations: {memory: 128M}

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SERVER_ROOT_URL: ${MONITOR_URL}/
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GF_SUB_PATH}
      GF_SECURITY_ADMIN_PASSWORD: ${MONITOR_PASSWORD}
      GF_SECURITY_COOKIE_SECURE: 'true'
      GF_SECURITY_DISABLE_GRAVATAR: 'true'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/${HOME_DASHBOARD}.json
      DB_PASSWORD: ${DB_PASSWORD}
      FLEET_PASSWORD: ${FLEET_PASSWORD}
    volumes:
      - ./etc/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./etc/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [app]
    logging: *logging
    deploy:
      resources:
        # 384M got the hub's Grafana OOM-killed while it served every server's dashboards
        limits: {cpus: '0.50', memory: 768M}
        reservations: {memory: 96M}

  alloy:
    image: grafana/alloy:v1.20.1
    command: [run, /etc/alloy/config.alloy, --storage.path=/var/lib/alloy/data, --server.http.listen-addr=0.0.0.0:12345]
    volumes:
      - ./etc/alloy:/etc/alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    networks: [app]
    logging: *logging
    deploy:
      mode: global
      resources:
        limits: {cpus: '0.25', memory: 192M}
        reservations: {memory: 64M}

  node-exporter:
    image: prom/node-exporter:v1.12.1
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|run|var/lib/docker)($$|/)
      - --collector.textfile.directory=/host${BACKUP_DIR}
    volumes:
      - /:/host:ro,rslave
    networks: [app]
    logging: *logging
    deploy:
      mode: global
      resources:
        limits: {cpus: '0.10', memory: 64M}
        reservations: {memory: 16M}

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.swarm.service.name
      - --disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl,cpuset,advtcp,memory_numa,process
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [app]
    logging: *logging
    deploy:
      mode: global
      resources:
        limits: {cpus: '0.25', memory: 192M}
        reservations: {memory: 64M}

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    command:
      - --extend.query-path=/etc/postgres-exporter/queries.yml
      - --collector.stat_statements
      - --collector.stat_statements.include_query
      - --collector.stat_statements.query_length=200
      - --collector.stat_statements.limit=50
      - --no-collector.stat_activity
      - --no-collector.stat_user_tables
      - --no-collector.statio_user_tables
    environment:
      DATA_SOURCE_NAME: postgresql://observer:${DB_PASSWORD}@${STACK}_db:5432/${DB}?sslmode=disable&application_name=observer-exporter
    volumes:
      - ./etc/postgres-exporter:/etc/postgres-exporter:ro
    networks: [app]
    logging: *logging
    deploy:
      resources:
        limits: {cpus: '0.10', memory: 64M}
        reservations: {memory: 16M}

  # One reserved-slot connection that logs live sessions every 30s (see recorder.sql).
  recorder:
    image: postgres:17-alpine
    command: [psql, -XAtq, -f, /etc/recorder/recorder.sql]
    environment:
      PGHOST: ${STACK}_db
      PGUSER: observer
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: postgres
      PGAPPNAME: observer-recorder
    volumes:
      - ./etc/recorder:/etc/recorder:ro
    networks: [app]
    logging: *logging
    deploy:
      restart_policy: {condition: any, delay: 10s}
      resources:
        limits: {cpus: '0.10', memory: 32M}

  blackbox:
    image: prom/blackbox-exporter:v0.29.0
    command: [--config.file=/etc/blackbox/blackbox.yml]
    volumes:
      - ./etc/blackbox:/etc/blackbox:ro
    networks: [app]
    logging: *logging
    deploy:
      resources:
        limits: {cpus: '0.10', memory: 48M}
        reservations: {memory: 16M}

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
  alloy-data:

networks:
  app:
    name: ${NETWORK}
    external: true
