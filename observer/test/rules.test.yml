rule_files:
  - ../config/prometheus/rules/observer.yml

evaluation_interval: 30s

tests:
  # 80 of 92 usable (100 - 3 superuser - 5 reserved); the observer's own connection is ignored
  - interval: 30s
    input_series:
      - {series: pg_settings_max_connections, values: 100x20}
      - {series: pg_settings_superuser_reserved_connections, values: 3x20}
      - {series: pg_settings_reserved_connections, values: 5x20}
      - {series: 'pg_holder_connections{holder="gass_odoo.1", opid="101", state="idle", usename="odoo"}', values: 50x20}
      - {series: 'pg_holder_connections{holder="gass_odoo.1", opid="102", state="active", usename="odoo"}', values: 30x20}
      - {series: 'pg_holder_connections{holder="observer-exporter", opid="", state="active", usename="observer"}', values: 9x20}
      - {series: 'pg_holder_max_xact_seconds{holder="gass_odoo.1", opid="103", state="idle in transaction", datname="gass", usename="odoo"}', values: 400x20}
    alert_rule_test:
      - eval_time: 1m
        alertname: PostgresConnectionsHigh
        exp_alerts: []
      - eval_time: 3m
        alertname: PostgresConnectionsHigh
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: 86.96% of usable connections taken
              description: The holders table shows which process and address hold them.
              dashboard: __URL__/d/pg-connections
      - eval_time: 3m
        alertname: PostgresIdleInTransaction
        exp_alerts:
          - exp_labels: {severity: warning, holder: gass_odoo.1, opid: '103', datname: gass}
            exp_annotations:
              summary: gass_odoo.1-103 has sat idle in a transaction for 6m 40s
              description: It holds its locks and its connection until it commits; look up that pid in the Odoo log.
              dashboard: __URL__/d/pg-connections

  # 85 of 92 crosses the critical line too
  - interval: 30s
    input_series:
      - {series: pg_settings_max_connections, values: 100x20}
      - {series: pg_settings_superuser_reserved_connections, values: 3x20}
      - {series: pg_settings_reserved_connections, values: 5x20}
      - {series: 'pg_holder_connections{holder="odoo", opid="7", state="idle", usename="odoo"}', values: 85x20}
    alert_rule_test:
      - eval_time: 3m
        alertname: PostgresConnectionsHigh
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: 92.39% of usable connections taken
              description: The holders table shows which process and address hold them.
              dashboard: __URL__/d/pg-connections
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: 92.39% of usable connections taken
              description: New connections will be refused soon. The holders table shows who holds them.
              dashboard: __URL__/d/pg-connections

  # ir_cron sits on page 0 while stock_move keeps scanning; only the stalled one alerts, after 30 min
  - interval: 30s
    input_series:
      - {series: 'pg_stat_progress_vacuum_heap_blks_scanned{datname="gass", relname="ir_cron"}', values: 0x80}
      - {series: 'pg_stat_progress_vacuum_phase{datname="gass", relname="ir_cron", phase="scanning heap"}', values: 1x80}
      - {series: 'pg_stat_progress_vacuum_heap_blks_scanned{datname="gass", relname="stock_move"}', values: 0+100x80}
      - {series: 'pg_stat_progress_vacuum_phase{datname="gass", relname="stock_move", phase="scanning heap"}', values: 1x80}
    alert_rule_test:
      - eval_time: 14m
        alertname: PostgresVacuumStuck
        exp_alerts: []
      - eval_time: 31m
        alertname: PostgresVacuumStuck
        exp_alerts:
          - exp_labels: {severity: critical, datname: gass, relname: ir_cron}
            exp_annotations:
              summary: Vacuum of ir_cron has scanned no page for 30 minutes
              description: Queries on that table queue behind it and cannot be cancelled. If Postgres CPU is pegged it is looping, and only a Postgres restart frees it.
              dashboard: __URL__/d/pg-live

  # PG 16 checkpoints stop after 10 min; PG 17 keeps checkpointing every 5 min
  - interval: 5m
    input_series:
      - {series: 'pg_stat_bgwriter_checkpoints_timed_total{instance="pg16"}', values: 0 1 2 2 2 2 2 2 2 2 2 2 2 2 2}
      - {series: 'pg_stat_checkpointer_num_timed_total{instance="pg17"}', values: 0+1x14}
    alert_rule_test:
      - eval_time: 40m
        alertname: PostgresCheckpointStuck
        exp_alerts: []
      - eval_time: 60m
        alertname: PostgresCheckpointStuck
        exp_alerts:
          - exp_labels: {severity: critical, instance: pg16}
            exp_annotations:
              summary: The checkpointer has not started a checkpoint for 45 minutes
              description: The checkpointer waits on a page lock, so WAL piles up and a restart has more to replay. Look for a stuck vacuum or a session waiting on an LWLock.
              dashboard: __URL__/d/pg-live
