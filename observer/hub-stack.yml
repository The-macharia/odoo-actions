# Added to stack.yml on the hub only.
services:
  alertmanager:
    image: prom/alertmanager:v0.34.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=https://${HUB}/alertmanager/
    volumes:
      - ./etc/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./secrets/telegram_token:/etc/alertmanager/telegram_token:ro
      - ./secrets/heartbeat_url:/etc/alertmanager/heartbeat_url:ro
      - alertmanager-data:/alertmanager
    networks: [app]
    logging:
      driver: json-file
      options: {max-size: 20m, max-file: '3'}
    deploy:
      resources:
        limits: {cpus: '0.10', memory: 64M}
        reservations: {memory: 16M}

volumes:
  alertmanager-data:
