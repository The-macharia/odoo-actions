name: Build Odoo image
description: Build the calling repo's image on the shared cloud builder, tagged with branch and commit.
inputs:
  docker-user:
    description: Docker Hub user
    required: true
  docker-pat:
    description: Docker Hub token
    required: true
  namespace:
    description: Docker Hub namespace of the image
    default: muritechnologies
  base-image:
    description: Base image passed as BASE_IMAGE
    default: muritechnologies/odoo-enterprise:18.0
runs:
  using: composite
  steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        username: ${{ inputs.docker-user }}
        password: ${{ inputs.docker-pat }}

    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      with:
        driver: cloud
        endpoint: muritechnologies/odoo-builder

    # the sha tag is what deploy runs, so re-running an old deploy is a rollback
    - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: .
        push: true
        tags: |
          ${{ inputs.namespace }}/${{ github.event.repository.name }}:${{ github.ref_name }}
          ${{ inputs.namespace }}/${{ github.event.repository.name }}:${{ github.sha }}
        labels: |
          org.opencontainers.image.source=${{ github.event.repository.html_url }}
          org.opencontainers.image.revision=${{ github.sha }}
        build-args: BASE_IMAGE=${{ inputs.base-image }}
