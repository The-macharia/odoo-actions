name: Deploy Odoo stack
description: Sync config to the server, update the swarm stack in place and reload nginx.
inputs:
  stack:
    description: Swarm stack name
    required: true
  image:
    description: Image reference from the build action
    required: true
  docker-user:
    description: Docker Hub user for registry images. Empty skips login.
  docker-pat:
    description: Docker Hub token
  network:
    description: External overlay network the compose file joins (default odoo_swarm). Must differ per stack on a shared host.
  compose-file:
    description: Default docker-compose.yml
  project-dir:
    description: Default /home/odoo/odoo
runs:
  using: composite
  steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - if: inputs.docker-user != ''
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        username: ${{ inputs.docker-user }}
        password: ${{ inputs.docker-pat }}

    - shell: bash
      env:
        STACK: ${{ inputs.stack }}
        IMAGE: ${{ inputs.image }}
        NETWORK: ${{ inputs.network || 'odoo_swarm' }}
        COMPOSE: ${{ inputs.compose-file || 'docker-compose.yml' }}
        PROJECT_DIR: ${{ inputs.project-dir || '/home/odoo/odoo' }}
      run: |
        set -euo pipefail
        mkdir -p "$PROJECT_DIR"
        for f in config nginx scripts "$COMPOSE"; do
            [ ! -e "$f" ] || cp -r "$f" "$PROJECT_DIR/"
        done
        cd "$PROJECT_DIR"

        [ "$(docker info --format '{{.Swarm.LocalNodeState}}')" = active ] \
            || docker swarm init --advertise-addr "$(ip -4 route get 1.1.1.1 | awk '{for(i=1;i<NF;i++) if ($i=="src") print $(i+1)}')"
        docker network inspect "$NETWORK" >/dev/null 2>&1 \
            || docker network create --driver overlay --attachable "$NETWORK"

        resolve=always
        [[ $IMAGE == localhost/* ]] && resolve=never
        IMAGE_TAG="$IMAGE" docker stack deploy -c "$COMPOSE" --with-registry-auth \
            --resolve-image "$resolve" --prune --detach=false "$STACK"

        if docker service inspect "${STACK}_nginx" >/dev/null 2>&1; then
            docker service update --force --detach=false "${STACK}_nginx"
        fi

