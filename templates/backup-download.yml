name: Download Latest Backup
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ${{ vars.RUNNER }}
    environment: production
    timeout-minutes: 30
    steps:
      - id: latest
        env:
          DIR: ${{ vars.BACKUP_DIR || '/home/odoo/backups' }}
          DB: ${{ vars.MAIN_DB }}
        run: echo "file=$(ls -t "$DIR/$DB".*.zip | head -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ steps.latest.outputs.file }}
          retention-days: 1
          compression-level: 0
          archive: false
