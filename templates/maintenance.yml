name: Server Maintenance
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ${{ vars.RUNNER }}
    environment: production
    timeout-minutes: 15
    steps:
      # without -a these remove only anonymous volumes and dangling images; named data volumes are never touched
      - run: docker volume prune -f && docker image prune -f

      - uses: The-macharia/odoo-actions/ssl-renew@v1
        with:
          stack: ${{ vars.STACK }}
