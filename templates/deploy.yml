name: Deploy
on:
  push:
    branches: [main, stage]
    paths:
      - Dockerfile
      - requirements.txt
      - docker-compose.yml
      - stage-compose.yml
      - config/**
      - custom-addons/**
      - third-party/**
      - nginx/**
      - scripts/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: odoo-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ vars.IMAGE_REPO && 'ubuntu-latest' || vars.RUNNER }}
    timeout-minutes: 30
    steps:
      - uses: The-macharia/odoo-actions/build@v1
        with:
          image-repo: ${{ vars.IMAGE_REPO }}
          base-image: ${{ vars.BASE_IMAGE }}
          builder: ${{ vars.BUILDER }}
          docker-user: ${{ secrets.DOCKER_USER }}
          docker-pat: ${{ secrets.DOCKER_PAT }}

  deploy:
    needs: build
    runs-on: ${{ vars.RUNNER }}
    environment: ${{ github.ref_name == 'main' && 'production' || 'stage' }}
    timeout-minutes: 60
    steps:
      - uses: The-macharia/odoo-actions/deploy@v1
        with:
          stack: ${{ vars.STACK }}
          image-repo: ${{ vars.IMAGE_REPO }}
          network: ${{ vars.NETWORK }}
          compose-file: ${{ vars.COMPOSE_FILE }}
          project-dir: ${{ vars.PROJECT_DIR }}
          docker-user: ${{ secrets.DOCKER_USER }}
          docker-pat: ${{ secrets.DOCKER_PAT }}

  upgrade:
    needs: deploy
    runs-on: ${{ vars.RUNNER }}
    environment: ${{ github.ref_name == 'main' && 'production' || 'stage' }}
    timeout-minutes: 120
    steps:
      - uses: The-macharia/odoo-actions/module-upgrade@v1
        with:
          stack: ${{ vars.STACK }}
          db: ${{ vars.UPGRADE_DB }}
