name: Back up Odoo database
description: Zip backup (dump + filestore) of the stack's database, verified before old backups are purged.
inputs:
  stack:
    description: Swarm stack name
    required: true
  db:
    description: Odoo database name
    required: true
  backup-dir:
    description: Default /home/odoo/backups
  keep-days:
    description: Delete backups older than this many days
    default: '4'
  network:
    description: Overlay network the throwaway container joins (default odoo_swarm)
  telegram-bot-token:
    description: Optional; with telegram-chat-id, posts every run's result (done, failed, stopped) to Telegram
  telegram-chat-id:
    description: Numeric id of the Telegram chat or group (-100... for supergroups)
runs:
  using: composite
  steps:
    - id: backup
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
        DB: ${{ inputs.db }}
        BACKUP_DIR: ${{ inputs.backup-dir || '/home/odoo/backups' }}
        KEEP_DAYS: ${{ inputs.keep-days }}
        NETWORK: ${{ inputs.network }}
      run: |
        set -euo pipefail
        # one folder per database: several databases can share a server and its BACKUP_DIR
        dir="$BACKUP_DIR/$DB"
        mkdir -p "$dir"
        # zips written before the per-database folders
        find "$BACKUP_DIR" -maxdepth 1 -name "$DB.*.zip" -exec mv -n -t "$dir" {} +
        file="$DB.$(date +%F-%H%M%S).zip"
        name="$STACK-backup-$$"
        echo "file=$file" >> "$GITHUB_OUTPUT"
        echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

        # On cancel the runner signals only this shell and SIGKILLs the rest, so the
        # container is removed from here, not odoo-run; the job must sit in `wait`
        # for the trap to fire. A partial zip is dropped so backup-download never
        # serves it as the newest file.
        trap 'docker rm -f "$name" >/dev/null 2>&1; [ -n "${ok:-}" ] || rm -f "$dir/$file"' EXIT
        trap 'exit 130' INT TERM

        ODOO_RUN_ARGS="--name $name --user 0:0 --mount type=bind,src=$dir,dst=/var/backups" \
            bash "$GITHUB_ACTION_PATH/../bin/odoo-run" "$STACK" \
            click-odoo-backupdb -c /etc/odoo/odoo.conf "$DB" "/var/backups/$file" &
        wait $!

        python3 -c 'import sys, zipfile; sys.exit(zipfile.ZipFile(sys.argv[1]).testzip() is not None)' \
            "$dir/$file"
        ok=1
        echo "size=$(du -h "$dir/$file" | cut -f1)" >> "$GITHUB_OUTPUT"
        # read by the observer's node-exporter, which mounts only metrics/ and runs as nobody
        mkdir -p -m 755 "$BACKUP_DIR/metrics"
        prom="$BACKUP_DIR/metrics/odoo_backup_$DB.prom"
        echo "odoo_backup_last_success_timestamp_seconds{db=\"$DB\"} $(date +%s)" > "$prom.$$"
        chmod 644 "$prom.$$"
        mv "$prom.$$" "$prom"
        # the single shared file of earlier versions would repeat a database's series, and node-exporter
        # drops the whole folder on a duplicate
        rm -f "$BACKUP_DIR/metrics/odoo_backup.prom"

        find "$dir" -name "$DB.*.zip" -mtime +"$KEEP_DAYS" -delete
        ls -lh "$dir"

    # A composite step still runs after the job is cancelled or times out (checked on GitHub);
    # both show here as outcome "cancelled". Success posts silently, failures with sound.
    - if: always() && inputs.telegram-bot-token != '' && inputs.telegram-chat-id != ''
      shell: bash
      env:
        OUTCOME: ${{ steps.backup.outcome }}
        STARTED: ${{ steps.backup.outputs.started }}
        FILE: ${{ steps.backup.outputs.file }}
        SIZE: ${{ steps.backup.outputs.size }}
        DB: ${{ inputs.db }}
        TOKEN: ${{ inputs.telegram-bot-token }}
        CHAT: ${{ inputs.telegram-chat-id }}
      run: |
        took=$(( $(date +%s) - ${STARTED:-$(date +%s)} ))
        dur="$((took / 60))m $((took % 60))s"
        client=${GITHUB_REPOSITORY#*/}
        case $OUTCOME in
          success)   head="✅ <b>$client</b> backup done" detail="$FILE, $SIZE, $dur" ;;
          cancelled) head="⛔ <b>$client</b> backup stopped" detail="$DB, cancelled or timed out after $dur" ;;
          *)         head="❌ <b>$client</b> backup failed" detail="$DB, after $dur" ;;
        esac
        text="$head
        $detail
        <a href=\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\">run log</a>"
        resp=$(curl -sS -m 20 "https://api.telegram.org/bot$TOKEN/sendMessage" \
            --data-urlencode "chat_id=$CHAT" --data-urlencode "text=$text" -d parse_mode=HTML \
            -d disable_notification=$([ "$OUTCOME" = success ] && echo true || echo false)) || true
        # a lost notice must not fail a good backup
        [[ $resp == *'"ok":true'* ]] || echo "::warning::Telegram did not take the backup notice: ${resp:-no response}"
