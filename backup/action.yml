name: Back up Odoo database
description: Zip backup (dump + filestore) of the stack's database, verified before old backups are purged.
inputs:
  stack:
    description: Swarm stack name
    required: true
  db:
    description: Odoo database name
    required: true
  backup-dir:
    description: Default /home/odoo/backups
  keep-days:
    description: Delete backups older than this many days
    default: '4'
  network:
    description: Overlay network the throwaway container joins (default odoo_swarm)
runs:
  using: composite
  steps:
    - shell: bash
      env:
        STACK: ${{ inputs.stack }}
        DB: ${{ inputs.db }}
        BACKUP_DIR: ${{ inputs.backup-dir || '/home/odoo/backups' }}
        KEEP_DAYS: ${{ inputs.keep-days }}
        NETWORK: ${{ inputs.network }}
      run: |
        set -euo pipefail
        mkdir -p "$BACKUP_DIR"
        file="$DB.$(date +%F-%H%M%S).zip"
        name="$STACK-backup-$$"

        # On cancel the runner signals only this shell and SIGKILLs the rest, so the
        # container is removed from here, not odoo-run; the job must sit in `wait`
        # for the trap to fire. A partial zip is dropped so backup-download never
        # serves it as the newest file.
        trap 'docker rm -f "$name" >/dev/null 2>&1; [ -n "${ok:-}" ] || rm -f "$BACKUP_DIR/$file"' EXIT
        trap 'exit 130' INT TERM

        ODOO_RUN_ARGS="--name $name --user 0:0 --mount type=bind,src=$BACKUP_DIR,dst=/var/backups" \
            bash "$GITHUB_ACTION_PATH/../bin/odoo-run" "$STACK" \
            click-odoo-backupdb -c /etc/odoo/odoo.conf "$DB" "/var/backups/$file" &
        wait $!

        python3 -c 'import sys, zipfile; sys.exit(zipfile.ZipFile(sys.argv[1]).testzip() is not None)' \
            "$BACKUP_DIR/$file"
        ok=1
        # read by the observer's node-exporter, which mounts only metrics/ and runs as nobody
        mkdir -p -m 755 "$BACKUP_DIR/metrics"
        echo "odoo_backup_last_success_timestamp_seconds{db=\"$DB\"} $(date +%s)" > "$BACKUP_DIR/metrics/odoo_backup.prom.$$"
        chmod 644 "$BACKUP_DIR/metrics/odoo_backup.prom.$$"
        mv "$BACKUP_DIR/metrics/odoo_backup.prom.$$" "$BACKUP_DIR/metrics/odoo_backup.prom"

        find "$BACKUP_DIR" -name "$DB.*.zip" -mtime +"$KEEP_DAYS" -delete
        ls -lh "$BACKUP_DIR"
