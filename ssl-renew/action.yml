name: Renew SSL certificates
description: certbot renew against the letsencrypt dir mounted into <stack>_nginx, then reload nginx.
inputs:
  stack:
    description: Swarm stack name
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SVC: ${{ inputs.stack }}_nginx
      run: |
        set -euo pipefail
        le=$(docker service inspect "$SVC" --format '{{range .Spec.TaskTemplate.ContainerSpec.Mounts}}{{if eq .Target "/etc/letsencrypt"}}{{.Source}}{{end}}{{end}}')
        [ -n "$le" ] || { echo "$SVC mounts no /etc/letsencrypt, nothing to renew"; exit 0; }
        lib="${le%/etc/letsencrypt}/var/lib/letsencrypt"

        if docker service inspect "$SVC" --format '{{range .Endpoint.Ports}}{{.PublishedPort}} {{end}}' | grep -qw 80; then
            docker service scale "$SVC=0" --detach=false
            trap 'docker service scale "$SVC=1" --detach=false' EXIT
        fi

        docker run --rm -v "$le:/etc/letsencrypt" -v "$lib:/var/lib/letsencrypt" -p 80:80 certbot/certbot renew

        docker ps -q -f "label=com.docker.swarm.service.name=$SVC" | xargs -r docker kill -s HUP
